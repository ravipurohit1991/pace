syntax = "proto3";

option java_package = "com.pace.reduction.proto";
option java_multiple_files = true;

enum CoachingToneProto {
  COACHING_TONE_SUPPORTIVE = 0;
  COACHING_TONE_DIRECT = 1;
  COACHING_TONE_TOUGH = 2;
}

enum ReminderIntensityProto {
  REMINDER_INTENSITY_OFF = 0;
  REMINDER_INTENSITY_GENTLE = 1;
  REMINDER_INTENSITY_STANDARD = 2;
}

enum ThemeModeProto {
  THEME_MODE_SYSTEM = 0;
  THEME_MODE_LIGHT = 1;
  THEME_MODE_DARK = 2;
}

enum AccentPaletteProto {
  ACCENT_PALETTE_SAGE = 0;
  ACCENT_PALETTE_OCEAN = 1;
  ACCENT_PALETTE_EMBER = 2;
  ACCENT_PALETTE_VIOLET = 3;
  ACCENT_PALETTE_SLATE = 4;
}

// Ordered so proto3's zero default is the richest experience; users step down from it.
enum MotionLevelProto {
  MOTION_LEVEL_FULL = 0;
  MOTION_LEVEL_SUBTLE = 1;
  MOTION_LEVEL_NONE = 2;
}

enum WidgetBackgroundProto {
  WIDGET_BACKGROUND_GRADIENT = 0;
  WIDGET_BACKGROUND_SOLID = 1;
  WIDGET_BACKGROUND_GLASS = 2;
}

// SAVER is the default: the widget's own Chronometer already ticks every second, so extra
// refreshes only exist to move the progress bar and the stats.
enum WidgetTickProto {
  WIDGET_TICK_SAVER = 0;
  WIDGET_TICK_LIVE = 1;
  WIDGET_TICK_OFF = 2;
}

message PacePreferences {
  int32 schema_version = 1;
  bool onboarding_completed = 2;
  int32 baseline_per_day = 3;
  int32 daily_ceiling = 4;
  int32 minimum_gap_minutes = 5;
  int32 wake_minutes = 6;
  int32 sleep_minutes = 7;
  bool weekend_wake_enabled = 8;
  int32 weekend_wake_minutes = 9;
  int32 morning_hold_minutes = 10;
  bool flexible_day = 11;
  int32 reduction_step = 12;
  int32 review_interval_days = 13;
  double price_per_pack = 14;
  int32 cigarettes_per_pack = 15;
  string currency_code = 16;
  string personal_reason = 17;
  string reward_name = 18;
  double reward_target = 19;
  CoachingToneProto coaching_tone = 20;
  ReminderIntensityProto reminder_intensity = 21;
  bool notification_private = 22;
  bool haptics_enabled = 23;
  bool weather_enabled = 24;
  bool trigger_places_enabled = 25;
  int64 last_successful_review_epoch_ms = 26;
  int32 pending_daily_ceiling = 27;
  string pending_ceiling_effective_date = 28;
  ThemeModeProto theme_mode = 29;
  string active_pause_session_id = 30;
  int64 active_pause_end_epoch_ms = 31;
  int64 active_pause_remaining_ms = 32;
  int64 active_pause_started_epoch_ms = 33;
  int64 last_coaching_notification_epoch_ms = 34;
  string notification_count_local_date = 35;
  int32 notification_count_today = 36;
  int64 notification_dismissed_until_epoch_ms = 37;
  bytes ollama_api_key_ciphertext = 38;
  string ollama_model = 39;
  bool ollama_enabled = 40;
  bool ollama_proactive_nudges = 41;
  string quit_date = 42;
  bool quit_mode = 43;
  bool provisioning_seed_applied = 44;
  bool adaptive_spacing_enabled = 45;
  int32 adaptive_spacing_step_minutes = 46;
  int32 adaptive_spacing_interval_days = 47;
  int32 adaptive_spacing_max_minutes = 48;
  string ollama_system_prompt = 49;
  // Inverted so proto3's false default means "stats are included".
  bool ollama_omit_stats = 50;
  bool ollama_checkups_enabled = 51;
  int32 ollama_checkup_interval_minutes = 52;
  int64 last_checkup_epoch_ms = 53;
  bool high_urge_window_enabled = 54;
  int32 high_urge_start_minutes = 55;
  int32 high_urge_end_minutes = 56;

  // Appearance. Booleans here are phrased so proto3's false default is the intended default.
  AccentPaletteProto accent_palette = 57;
  bool dynamic_color = 58;
  bool amoled_dark = 59;
  MotionLevelProto motion_level = 60;

  // Widget appearance and behaviour.
  WidgetBackgroundProto widget_background = 61;
  int32 widget_corner_radius_dp = 62;
  int32 widget_opacity_percent = 63;
  bool widget_hide_quote = 64;
  bool widget_hide_stats = 65;
  bool widget_hide_actions = 66;
  bool widget_hide_countdown = 67;
  bool widget_hide_streak = 68;
  bool widget_skip_log_confirm = 69;
  bool widget_disable_pulse = 70;
  WidgetTickProto widget_tick = 71;
  bool widget_hide_steps = 78;

  // Retained for migration; the app now stores one multimodal model in both fields.
  string ollama_vision_model = 72;
  string ollama_image_system_prompt = 73;

  // Step counting. The hardware counter is cumulative since boot, so the last raw value read is
  // kept here to turn the next reading into a delta. `set` is separate because a raw value of 0 is
  // legitimate on a freshly booted device and must not be mistaken for "never read".
  int64 step_counter_anchor = 74;
  bool step_counter_anchor_set = 75;
  // Stride length is derived from this; 0 means "not stated" and falls back to the default.
  int32 height_centimetres = 76;
  bool step_counting_enabled = 77;

  // What they are doing this for, in their own words. Up to five, surfaced at the moment they are
  // least able to remember any of them.
  repeated string personal_values = 79;

  // The coach's own daily agenda: a morning plan, invitations to move during the day, and an
  // evening line. Inverted so proto3's false default means an enabled coach also runs its agenda.
  bool auto_coach_disabled = 80;
  int32 work_start_minutes = 81;
  int32 work_end_minutes = 82;
  int32 move_invites_per_day = 83;

  // Agenda bookkeeping: which beats have already gone out, so none of them repeats.
  string agenda_morning_date = 84;
  string agenda_evening_date = 85;
  string agenda_move_date = 86;
  int32 agenda_move_count = 87;
  int64 agenda_last_move_epoch_ms = 88;

  // Habit tracking. Stored inverted so upgrades preserve the current all-on experience.
  bool hide_drink_quick_log = 89;
  bool hide_coffee_tracking = 90;
  bool hide_alcohol_tracking = 91;
  bool hide_other_beverage_tracking = 92;
  string other_beverage_label = 93;
}

enum WidgetStateProto {
  WIDGET_STATE_SETUP = 0;
  WIDGET_STATE_SPACING = 1;
  WIDGET_STATE_WINDOW_MET = 2;
  WIDGET_STATE_MORNING_HOLD = 3;
  WIDGET_STATE_REST = 4;
  WIDGET_STATE_CEILING = 5;
  WIDGET_STATE_RECOVERY = 6;
}

message WidgetSnapshot {
  int64 generated_at_epoch_ms = 1;
  string local_date = 2;
  int32 count_today = 3;
  int32 ceiling = 4;
  int64 last_active_log_epoch_ms = 5;
  WidgetStateProto state = 6;
  int64 state_until_epoch_ms = 7;
  string safe_message = 8;
  string undo_log_id = 9;
  int64 undo_expiry_epoch_ms = 10;
  string latest_badge_id = 11;
  int32 badge_count = 12;
  int32 minimum_gap_minutes = 13;
  int32 smoke_free_minutes = 14;
  int32 cigarettes_avoided = 15;
  double money_saved = 16;
  string currency_code = 17;
  int32 zero_day_streak = 18;
  string quote = 19;
  int64 quote_generated_epoch_ms = 20;
  // Set by the first widget log tap; a second tap before this expires commits it.
  int64 log_armed_until_epoch_ms = 21;
  // Steps walked today, or 0 when step counting is off — the widget has no database of its own.
  int64 steps_today = 24;
  // 22 and 23 anchored two system Chronometers. The widget now states its figures in whole
  // minutes, which needs only the totals above, so both are retired rather than left to rot.
  reserved 22, 23;
}
