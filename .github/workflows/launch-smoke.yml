name: Launch smoke test

# Installs real APKs on an emulator, walks onboarding and every tab, and fails with the stack trace
# if the app dies. Unit tests and lint cannot see a crash that only happens on a device.
on:
  workflow_dispatch:
    inputs:
      release_from:
        description: 'Published release to install first, e.g. v0.2.0 (empty to skip the upgrade path)'
        required: false
        default: ''
      release_to:
        description: 'Published release to test, e.g. v0.3.0 (empty to skip)'
        required: false
        default: ''
  pull_request:
    branches: [main]
  push:
    branches: [main, 'claude/**']

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # A release build with R8, signed with a throwaway key so it installs. Minification is the
      # usual difference between "works in debug" and "will not open".
      - name: Build minified release signed with the debug key
        run: |
          ./gradlew assembleDebug assembleRelease --stacktrace
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          keytool -genkeypair -keystore "$RUNNER_TEMP/smoke.jks" -storepass android -keypass android \
            -alias smoke -keyalg RSA -keysize 2048 -validity 1 -dname "CN=Pace smoke test"
          "$BUILD_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/smoke.jks" --ks-pass pass:android \
            --ks-key-alias smoke --key-pass pass:android --out head-release.apk "$UNSIGNED"
          cp "$(find app/build/outputs/apk/debug -name '*.apk' | head -1)" head-debug.apk

      - name: Download published releases
        env:
          GH_TOKEN: ${{ github.token }}
          FROM: ${{ github.event.inputs.release_from }}
          TO: ${{ github.event.inputs.release_to }}
        run: |
          echo "Releases: from=${FROM:-none} to=${TO:-none}"
          if [ -n "$FROM" ]; then gh release download "$FROM" -p '*.apk' -O from.apk; fi
          if [ -n "$TO" ]; then gh release download "$TO" -p '*.apk' -O to.apk; fi
          ls -la *.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash .github/smoke/run-all.sh

      # Last, so the crash report sits at the end of the log rather than under the emulator's output.
      - name: Crash report
        if: always()
        run: cat smoke-report.txt 2>/dev/null || echo "No report written"
